
<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    AIoT Speech System
  </title>

  <style>

    body {
      font-family:
        Arial,
        sans-serif;

      max-width: 800px;
      margin: 40px auto;
      padding: 20px;
    }


    button {
      padding: 12px 20px;
      margin-right: 10px;
      font-size: 16px;
      cursor: pointer;
    }


    .box {
      border: 1px solid #ccc;
      padding: 20px;
      margin-top: 20px;
      border-radius: 8px;
    }


    #micStatus {
      font-size: 18px;
      font-weight: bold;
    }


    audio {
      width: 100%;
      margin-top: 15px;
    }

  </style>

</head>


<body>

  <h1>
    AIoT Speech-to-Text System
  </h1>


  <div class="box">

    <h2>
      ESP32 Status
    </h2>

    <p id="espStatus">
      Waiting...
    </p>

  </div>


  <div class="box">

    <h2>
      Microphone
    </h2>

    <button id="startButton">
      Start Recording
    </button>

    <button id="stopButton">
      Stop Recording
    </button>


    <p id="micStatus">
      🔴 Microphone OFF
    </p>

  </div>


  <div class="box">

    <h2>
      Recorded Audio
    </h2>

    <div id="audioContainer">
      No audio recorded yet.
    </div>

  </div>


  <div class="box">

    <h2>
      Upload Status
    </h2>

    <p id="uploadStatus">
      Waiting...
    </p>

  </div>


  <script src="app.js"></script>

</body>

</html>
