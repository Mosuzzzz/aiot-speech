
<!DOCTYPE html>
<html lang="th">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    ระบบเสียง AIoT
  </title>

  <style>

    body {
      font-family:
        Arial,
        sans-serif;

      max-width: 800px;
      margin: 40px auto;
      padding: 20px;
    }


    button {
      padding: 12px 20px;
      margin-right: 10px;
      font-size: 16px;
      cursor: pointer;
    }


    .box {
      border: 1px solid #ccc;
      padding: 20px;
      margin-top: 20px;
      border-radius: 8px;
    }


    #micStatus {
      font-size: 18px;
      font-weight: bold;
    }


    audio {
      width: 100%;
      margin-top: 15px;
    }

  </style>

</head>


<body>

  <h1>
    ระบบแปลงเสียงเป็นข้อความ AIoT
  </h1>


  <div class="box">

    <h2>
      สถานะ ESP32
    </h2>

    <p id="espStatus">
      กำลังรอ...
    </p>

  </div>


  <div class="box">

    <h2>
      ไมโครโฟน
    </h2>

    <button id="startButton">
      เริ่มบันทึกเสียง
    </button>

    <button id="stopButton">
      หยุดบันทึกเสียง
    </button>


    <p id="micStatus">
      🔴 ปิดไมโครโฟน
    </p>

  </div>


  <div class="box">

    <h2>
      เสียงที่บันทึก
    </h2>

    <div id="audioContainer">
      ยังไม่มีเสียงที่บันทึก
    </div>

  </div>


  <div class="box">

    <h2>
      สถานะการอัปโหลด
    </h2>

    <p id="uploadStatus">
      กำลังรอ...
    </p>

  </div>


  <div class="box">

    <h2>
      ข้อความถอดเสียง
    </h2>

    <p id="transcriptStatus">
      กำลังรอ...
    </p>

    <p id="transcript">
      ยังไม่มีข้อความถอดเสียง
    </p>

  </div>


  <div class="box">

    <h2>
      สรุปโดย AI
    </h2>

    <p id="summaryStatus">
      กำลังรอ...
    </p>

    <p id="summary">
      ยังไม่มีสรุป
    </p>

  </div>


  <div class="box">

    <h2>
      ประเด็นสำคัญ
    </h2>

    <ul id="keyPoints">
      <li>ยังไม่มีประเด็นสำคัญ</li>
    </ul>

  </div>


  <script src="app.js"></script>

</body>

</html>
